apiVersion: apps/v1
kind: Deployment
metadata:
  name: manty-waf
  labels:
    app: manty-waf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: manty-waf
  template:
    metadata:
      labels:
        app: manty-waf
    spec:
      containers:
        - name: manty-waf
          image: manty-waf:dev
          args:
            - -mode
            - ingress
            - -listen
            - :8080
            - -route
            - app.example=http://app:8080
          ports:
            - name: http
              containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: manty-waf
spec:
  selector:
    app: manty-waf
  ports:
    - name: http
      port: 80
      targetPort: http
