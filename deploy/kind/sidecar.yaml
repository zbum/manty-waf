apiVersion: v1
kind: Namespace
metadata:
  name: manty-sidecar
---
apiVersion: v1
kind: Pod
metadata:
  name: app-with-manty-waf
  namespace: manty-sidecar
  labels:
    app: app
spec:
  containers:
    - name: app
      image: manty-waf:dev
      imagePullPolicy: IfNotPresent
      command: ["/usr/local/bin/echoapp"]
      args: ["-listen", ":8081"]
      ports:
        - name: http
          containerPort: 8081
    - name: manty-waf
      image: manty-waf:dev
      imagePullPolicy: IfNotPresent
      args:
        - -mode
        - sidecar
        - -listen
        - 127.0.0.1:8080
        - -upstream
        - http://127.0.0.1:8081
